services:
  - type: web
    name: lyricpad-next
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_ACCESS_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
